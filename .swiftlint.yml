only_rules:
  - array_init
  - attributes
  - block_based_kvo
#  - class_delegate_protocol #delegate protocol 应该被设定为 class-only,才能被弱引用
  - closing_brace
  - closure_end_indentation
#  - closure_parameter_position
  - closure_spacing
  - collection_alignment
  - comma
  - compiler_protocol_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
#  - control_statement #if while 等判断条件不要用括号 括起来
  - custom_rules
  - deployment_target
  - discarded_notification_center_observer
  - discouraged_object_literal
  - duplicate_enum_cases
  - duplicate_imports
  - dynamic_inline
  - empty_collection_literal
#  - empty_count
#  - empty_enum_arguments
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - empty_string
  - explicit_init
  - explicit_self
  - extension_access_modifier
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - for_where
#  - force_cast #避免强转
#  - force_try #避免 `try!`
#  - force_unwrapping #避免强制解包
#  - function_default_parameter_at_end
  - generic_type_name
  - identical_operands
#  - implicit_getter # read-only参数不应该有getter方法
  - inert_defer
  - is_disjoint
  - joined_default_parameter
#  - large_tuple #元祖成员
  - last_where
#  - leading_whitespace #文件末尾不应该存在空格符
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor #使用 swift 提供的 struct 构造函数， 避免使用 遗留的构造函数 比如 CGPointMake(10, 10)
  - legacy_hashing
  - legacy_multiple
  - legacy_nsgeometry_functions
  - legacy_random
  - let_var_whitespace
  - lower_acl_than_parent
  - mark
  - sorted_first_last
#  - multiple_closures_with_trailing_closure #当函数有多个闭包时, 不建议使用尾随闭包语法
  - no_fallthrough_only
  - nslocalizedstring_key
  - nslocalizedstring_require_bundle
  - nsobject_prefer_isequal
  - opening_brace #需要正确书写大括号格式
  - operator_usage_whitespace
  - operator_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefixed_toplevel_constant
#  - private_action #IBActions should be private
#  - private_outlet #IBOutlets 应该设置为 private， 来避免泄露
  - private_over_fileprivate
  - private_unit_test
#  - prohibited_interface_builder #应避免使用Interface Builder创建视图
  - prohibited_super_call
  - protocol_property_accessors_order
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - raw_value_for_camel_cased_codable_enum
  - reduce_boolean
  - reduce_into
  - redundant_discardable_let
  - redundant_nil_coalescing
  - redundant_objc_attribute
  - redundant_optional_initialization
  - redundant_set_access_control
#  - redundant_string_enum_value #在定义字符串枚举的时候, 当字符串枚举值等于枚举名称时，可以不用赋值
  - redundant_void_return
  - required_enum_case
  - return_arrow_whitespace
#  - shorthand_operator # 使用+= ， -=， *=， /=  代替 a = a + 1
  - single_test_class
#  - statement_position #else and catch 应该与 } 在同一行，以空格间隔
  - static_operator
  - superfluous_disable_command
  - switch_case_alignment
#  - syntactic_sugar #语法糖[Int] 代替Array
  - todo
  - trailing_comma #数组最后一个元素后面有逗号
#  - trailing_newline #末尾空行
  - trailing_semicolon
#  - trailing_whitespace #每一个空行不能有空格，会与Xcode换行后自动对齐生成的空格冲突，建议排除掉
  - type_name
  - unavailable_function
#  - unneeded_break_in_switch # 在switch-case语句中, 有方法调用或操作时,避免使用break语句
#  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - unused_capture_list
#  - unused_closure_parameter #函数的参数必须被使用
  - unused_control_flow_label
  - unused_declaration
  - unused_enumerated
  - unused_import
#  - unused_optional_binding
  - unused_setter_value
#  - vertical_whitespace #垂直方向上的空格行，限制为一行（注释除外）
#  - vertical_whitespace_closing_braces
#  - vertical_whitespace_opening_braces
  - void_return
  - xct_specific_matcher
  - yoda_condition
  
excluded:
  - Pods
  - Frameworks

